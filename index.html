<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FINN · Koritsu FinOps Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07090f;
      --surface: #0d1117;
      --surface2: #131920;
      --border: #1c2a38;
      --accent: #00c8a0;
      --accent2: #0084ff;
      --text: #d0dde8;
      --muted: #4a6070;
      --user-bubble: linear-gradient(135deg, #00c8a0, #0084ff);
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(0,200,160,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(ellipse, rgba(0,132,255,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .wrapper {
      width: 100%;
      max-width: 660px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      max-height: 780px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 4px;
      animation: fadeDown 0.4s ease both;
    }

    .logo-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(0,200,160,0.25);
    }

    .header-text h1 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .header-text h1 span { color: var(--accent); }

    .header-text p {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
      margin-top: 1px;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2.5s ease-in-out infinite;
    }

    /* Chat window */
    .chat-window {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
      animation: fadeUp 0.4s ease 0.1s both;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-row {
      display: flex;
      gap: 10px;
      animation: fadeUp 0.25s ease both;
    }

    .msg-row.user { justify-content: flex-end; }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .bubble {
      max-width: 76%;
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.65;
      font-weight: 400;
    }

    .bubble.assistant {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px 16px 16px 16px;
    }

    .bubble.user {
      background: var(--user-bubble);
      color: #fff;
      border-radius: 16px 16px 4px 16px;
      font-weight: 500;
    }

    .bubble strong { color: var(--accent); font-weight: 600; }
    .bubble a { color: var(--accent2); text-decoration: none; }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 16px;
      align-items: center;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.1s ease-in-out infinite;
      opacity: 0.7;
    }
    .typing span:nth-child(2) { animation-delay: 0.18s; background: mix(var(--accent), var(--accent2), 50%); }
    .typing span:nth-child(3) { animation-delay: 0.36s; background: var(--accent2); }

    /* Quick replies */
    .quick-wrap {
      padding: 6px 18px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .quick-btn {
      padding: 6px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-family: 'Sora', sans-serif;
      cursor: pointer;
      transition: all 0.18s;
    }

    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,200,160,0.06);
      transform: translateY(-1px);
    }

    /* Input area */
    .input-area {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: rgba(255,255,255,0.01);
    }

    textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13.5px;
      font-family: 'Sora', sans-serif;
      resize: none;
      max-height: 110px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    textarea::placeholder { color: var(--muted); }
    textarea:focus { outline: none; border-color: var(--accent); }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 14px rgba(0,200,160,0.3);
    }

    .send-btn:hover { transform: translateY(-1px); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 11px;
      color: #1e2e3a;
      animation: fadeUp 0.4s ease 0.2s both;
    }

    .footer a { color: #2a4050; text-decoration: none; }
    .footer a:hover { color: var(--muted); }

    /* Error */
    .error-msg {
      text-align: center;
      color: #f87171;
      font-size: 12px;
      padding: 8px 14px;
      background: rgba(248,113,113,0.08);
      border-radius: 8px;
      margin: 0 18px 8px;
    }

    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes bounce { 0%,80%,100% { transform:translateY(0); } 40% { transform:translateY(-7px); } }
    @keyframes pulse { 0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(0,200,160,0.4); } 50% { opacity:0.7; box-shadow: 0 0 0 5px rgba(0,200,160,0); } }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- Header -->
  <div class="header">
    <div class="logo-mark">⚡</div>
    <div class="header-text">
      <h1>FINN <span>·</span> Koritsu FinOps</h1>
      <p>Asistente comercial · Responde al instante</p>
    </div>
    <div class="status">
      <div class="status-dot"></div>
      En línea
    </div>
  </div>

  <!-- Chat Window -->
  <div class="chat-window">
    <div class="messages" id="messages"></div>

    <div id="quickWrap" class="quick-wrap"></div>
    <div id="errorBox" class="error-msg" style="display:none"></div>

    <div class="input-area">
      <textarea id="input" placeholder="Escribe tu pregunta..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    FINN puede cometer errores · <a href="mailto:finops.enquiries@koritsufinops.com">finops.enquiries@koritsufinops.com</a>
  </div>

</div>

<script>
  const QUICK_QUESTIONS = [
    "¿Qué servicios ofrece Koritsu?",
    "¿Cuánto puedo ahorrar en cloud?",
    "Quiero agendar una demo",
    "¿Hacéis formación FinOps?",
  ];

  let history = [];
  let loading = false;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const quickWrap = document.getElementById('quickWrap');
  const errorBox = document.getElementById('errorBox');

  function renderMd(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }

  function addMessage(role, content) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    if (role === 'assistant') {
      row.innerHTML = `
        <div class="avatar">⚡</div>
        <div class="bubble assistant">${renderMd(content)}</div>`;
    } else {
      row.innerHTML = `<div class="bubble user">${renderMd(content)}</div>`;
    }

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = 'typing';
    row.innerHTML = `
      <div class="avatar">⚡</div>
      <div class="bubble assistant" style="padding:0">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>`;
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function renderQuickReplies() {
    quickWrap.innerHTML = '';
    if (history.length > 2) return;
    QUICK_QUESTIONS.forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'quick-btn';
      btn.textContent = q;
      btn.onclick = () => sendMessage(q);
      quickWrap.appendChild(btn);
    });
  }

  async function sendMessage(text) {
    const userText = text || inputEl.value.trim();
    if (!userText || loading) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    errorBox.style.display = 'none';
    quickWrap.innerHTML = '';

    history.push({ role: 'user', content: userText });
    addMessage('user', userText);
    loading = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Error del servidor');

      removeTyping();
      history.push({ role: 'assistant', content: data.reply });
      addMessage('assistant', data.reply);
    } catch (err) {
      removeTyping();
      errorBox.textContent = 'Error de conexión. Por favor intenta de nuevo.';
      errorBox.style.display = 'block';
      history.pop();
    } finally {
      loading = false;
      sendBtn.disabled = false;
      renderQuickReplies();
    }
  }

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', () => sendMessage());

  // Init
  const greeting = `¡Hola! Soy **FINN**, el asistente virtual de **Koritsu FinOps** 👋

Puedo ayudarte con información sobre nuestros servicios de optimización cloud, governance FinOps, dashboards de costos y formación — o ayudarte a agendar una demo con nuestro equipo.

¿En qué puedo ayudarte hoy?`;

  history.push({ role: 'assistant', content: greeting });
  addMessage('assistant', greeting);
  renderQuickReplies();
</script>

</body>
</html>
